<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Historia del trap en España</title>
    <meta name="description" content="Formulario para proponer artistas del trap underground español que todavía no aparecen en la web.">
    <meta name="keywords" content="contacto, proponer artista, trap español, underground">
    <meta name="author" content="Curro Romero Diaz">
  </head>
  <body>
    <!-- Cabecera de la página -->
    <div>
      <h1>Propón un artista</h1>
      <p>
        ¿Conoces a algún artista de la escena underground que debería estar en esta web?
        Rellena el formulario y lo tendré en cuenta para las próximas actualizaciones.
      </p>
    </div>

    <hr>

    <!-- Formulario de propuesta -->
    <div>
      <form action="#" method="post">
        <fieldset>
          <legend>Tus datos</legend>
          <p>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" maxlength="40" required autofocus>
          </p>
          <p>
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required>
          </p>
          <p>
            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" maxlength="9" placeholder="600123456">
          </p>
        </fieldset>
      </form>
    </div>

    <hr>

    <!-- Pie de página -->
    <div>
      <p><a href="index.html">Volver al inicio</a></p>
      <p>&copy; 2026 Curro Romero Diaz</p>
      <p>Proyecto de Lenguajes de Marcas &middot; 1º DAM</p>
    </div>
  </body>
</html>
